version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  service_a:
    build: .
    restart: unless-stopped
    command: uvicorn service_a.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  service_b:
    build: .
    restart: unless-stopped
    command: python service_b/worker.py
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  capi_worker:
    build: .
    restart: unless-stopped
    command: python service_b/capi_worker.py
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  jobs_worker:
    build: .
    restart: unless-stopped
    command: python service_b/jobs_worker.py
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  master_bot:
    build: .
    restart: unless-stopped
    command: python master_bot/bot.py
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

volumes:
  postgres_data:
